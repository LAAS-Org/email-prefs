<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>ניהול העדפות מייל</title>
<link rel="stylesheet" href="../assets/prefs.css">
</head>
<body>
<div class="card">
  <h1>ניהול העדפות מייל</h1>
  <p>כאן אפשר לבטל מיילים שיווקיים (תזכורות לייב, סיכומים, עדכונים).</p>
  <p id="email" class="email"></p>
  <a id="unsub" class="btn" href="#">הסר אותי ממיילים שיווקיים</a>
</div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var e = q.get("e") || "", t = q.get("t") || "";
  try { document.getElementById("email").textContent = atob(e.replace(/-/g, "+").replace(/_/g, "/")); } catch (err) {}
  document.getElementById("unsub").href =
    "../unsubscribe/?e=" + encodeURIComponent(e) + "&t=" + encodeURIComponent(t);
})();
</script>
</body>
</html>
