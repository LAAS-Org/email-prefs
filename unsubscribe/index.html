<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>הוסרת מהרשימה</title>
<link rel="stylesheet" href="../assets/prefs.css">
</head>
<body>
<div class="card">
  <h1>הוסרת מהרשימה</h1>
  <p>
    לא תקבל/י עוד מיילים שיווקיים ממשפחת אדמנט קפיטל.
    ההסרה נקלטת ומעובדת תוך מספר דקות.
  </p>
  <p>מיילים חשובים על המנוי (תשלום, אימות) עדיין יישלחו במידת הצורך.</p>
  <p id="email" class="email"></p>
</div>
<script>
(function () {
  // Display only — the opt-out itself is recorded by the mail system when the
  // link in the email is clicked; this page holds no secrets and calls no API.
  var e = new URLSearchParams(location.search).get("e") || "";
  try {
    document.getElementById("email").textContent =
      atob(e.replace(/-/g, "+").replace(/_/g, "/"));
  } catch (err) {}
})();
</script>
</body>
</html>
